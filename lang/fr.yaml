topbar:
  theme_switcher:
    tooltip: Changer de thème jour/nuit
  login_button:
    text: Connexion
    tooltip: Se connecter à son espace personnel
  logout_button:
    tooltip: Se déconnecter
hike_panel:
  title: Randonnées disponibles
  hide_button:
    tooltip: Masquer/afficher la randonnée sur la carte
  colorpicker:
    tooltip: Modifier la couleur de la randonnée sur la carte
  share_button:
    tooltip: Partager cette randonnée
  upload_button:
    text: Cliquez ou faites glisser un fichier pour charger des randonnées
  delete_button:
    tooltip: Supprimer cette randonnée
elevation_plot:
  xlabel: Distance (km)
  ylabel: Altitude (m)
  hovertemplate:
    distance: Distance
    remaining_distance: Distance restante
    elevation: Altitude
    slope: Pente
menubar:
  hike_panel_button: 
    text: Randonnées
    tooltip: Ouvrir le panneau des randonnées (Alt + L)
  hall_of_fame_button: 
    text: Statistiques
    tooltip: Ouvrir le panneau des statistiques
login_modal:
  title: Connexion à son compte
  user_id_input:
    label: Entrez votre identifiant
    placeholder: MonIdentifiant
    error: Mauvais identifiant
  user_password_input:
    label: Entrez votre mot de passe
    placeholder: MonMotDePasse
    error: Mauvais mot de passe
  send_login_button:
    text: Se connecter à son compte
magic_link_modal:
  title: Lien partageable
  text: Copiez et partagez le lien ci-dessous pour permettre à d'autres d'ouvrir la randonnée sur la carte
validate_modal:
  text: Cliquez sur "Oui" pour supprimer de manière définitive la randonnée de la base de donnée.
  yes_button:
    text: Oui
  no_button:
    text: Non
notifications:
  login:
    success:
      title: Connexion réussie
  logout:
    success:
      title: Déconnexion réussie
  hike_upload:
    success:
      title: Chargement des randonnées réussi
    fail:
      title: Erreur lors du chargement des randonnées
      format_error:
        text: 'Le fichier suivant ne peut pas être lu: '
      already_loaded_error:
        text: 'Le fichier suivant est déjà chargé: '
  magic_link:
    fail:
      title: Mauvais lien de partage
      text: Aucune randonnée n'est associée au lien magique fourni dans l'url.
login_logout_buttons:
  login:
    text: Connexion
    tooltip: Se connecter à son espace personnel (Alt + A)
  logout:
    tooltip: Se déconnecter de son espace personnel