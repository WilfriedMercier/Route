topbar:
  theme_switcher:
    tooltip: Switch between light and dark themes
  login_button:
    text: Login
    tooltip: Login to your account
  logout_button:
    tooltip: Logout of your account
hike_panel:
  title: Available Hikes
  hide_button:
    tooltip: Show/hide hike on the map
  colorpicker:
    tooltip: Change the color of the hike on the map
  share_button:
    tooltip: Share this hike with others
  upload_button:
    text: Click or drag and drop to upload hikes
elevation_plot:
  xlabel: Distance (km)
  ylabel: Elevation (m)
  hovertemplate:
    distance: Distance
    remaining_distance: Remaining distance
    elevation: Elevation
menubar:
  hike_panel_button: 
    tooltip: Toggle the hike list panel
  hall_of_fame_button: 
    tooltip: Toggle the hall of fame panel
login_modal:
  title: Login to your account
  user_id_input:
    label: Enter your user ID
    placeholder: YourUserID
  user_password_input:
    label: Enter your password
    placeholder: Password
  send_login_button:
    text: Login
magic_link_modal:
  title: Shareable link
  text: Copy and share the link below to allow others to view the open the hike on the map
notifications:
  login:
    fail:
      title: Login failed
      username: Wrong username
      password: Wrong password
    success:
      title: Login successful
  logout:
    success:
      title: Logout successful
  hike_upload:
    success:
      title: All hikes properly loaded
    fail:
      title: Hike loading failed
      format_error:
        text: 'The following file could not be parsed: '
      already_loaded_error:
        text: 'The following file is already loaded: '
  magic_link:
    fail:
      title: Wrong shared link
      text: No hike is associated to the magic link used in the url.